# LOCAL test of the whole stack in Docker (not used on EC2).
#   docker compose up --build
# Then open http://localhost:8080   (pgAdmin: http://localhost:5050)
# Uses your AWS credentials from C:\Users\<you>\.aws for S3 resume uploads.
name: hireflow-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
      POSTGRES_DB: jobboard
    ports:
      - "5433:5432" # 5433 so it doesn't clash with your Windows Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d jobboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 8000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hireflow:hireflow@postgres:5432/jobboard
      JWT_SECRET: local-docker-only-secret-change-me-0123456789abcdef
      CORS_ORIGIN: http://localhost:8080
      AWS_REGION: us-east-1
      S3_BUCKET: jobboard-hireflow
    volumes:
      - ${USERPROFILE:-~}/.aws:/home/node/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:9.10
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hireflow.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    profiles: ["tools"] # start with: docker compose --profile tools up

volumes:
  pgdata:
